{{- if .Values.newapi.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: newapi-data
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.global.storageClass }}
  resources:
    requests:
      storage: 2Gi
{{- end }}
