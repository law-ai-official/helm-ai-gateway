{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - { name: tcp, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER,     valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } } }
            - { name: PGDATA,            value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "postgres"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: data,      mountPath: /var/lib/postgresql/data }
            - { name: init-script, mountPath: /docker-entrypoint-initdb.d }
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: init-script
          configMap:
            name: postgres-init
            defaultMode: 0755   # init.sh must be executable
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
{{- end }}
