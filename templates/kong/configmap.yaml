{{- if .Values.kong.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
data:
  # Kong declarative config (DB-less mode). Defines services, routes, and plugins.
  # Kong loads this on startup and watches for changes.
  kong.yml: |
    _format_version: "3.0"

    services:
      - name: newapi
        url: http://newapi:3000
        routes:
          - name: newapi-route
            paths:
              - /v1
            strip_path: false
        plugins:
          # body-capture: custom plugin (mounted via kong-body-capture-plugin
          # ConfigMap) that records full request + response bodies to the
          # chat_log DB via log-collector. Replaces http-log, which only logs
          # metadata and never the conversation content.
          - name: body-capture
            config:
              max_body_size: 10485760

      - name: librechat
        url: http://librechat:3080
        routes:
          - name: librechat-route
            paths:
              - /chat
            strip_path: true
{{- end }}
