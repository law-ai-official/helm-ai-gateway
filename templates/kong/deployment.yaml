{{- if .Values.kong.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "kong") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "kong") | nindent 8 }}
    spec:
      containers:
        - name: kong
          image: "{{ .Values.kong.image.repository }}:{{ .Values.kong.image.tag }}"
          imagePullPolicy: {{ .Values.kong.image.pullPolicy }}
          env:
            - { name: KONG_DATABASE,             value: "off" }
            - { name: KONG_DECLARATIVE_CONFIG,   value: /etc/kong/kong.yml }
            - { name: KONG_ADMIN_LISTEN,         value: "0.0.0.0:8001" }
            - { name: KONG_PROXY_ACCESS_LOG,     value: /dev/stdout }
            - { name: KONG_ADMIN_ACCESS_LOG,     value: /dev/stdout }
            - { name: KONG_PROXY_ERROR_LOG,      value: /dev/stderr }
            - { name: KONG_ADMIN_ERROR_LOG,      value: /dev/stderr }
            - { name: KONG_PLUGINS,              value: "bundled,body-capture" }
          ports:
            - { name: http,  containerPort: 8000 }
            - { name: https, containerPort: 8443 }
            - { name: admin, containerPort: 8001 }
          readinessProbe:
            httpGet: { path: /status, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: config, mountPath: /etc/kong }
            # Mount the body-capture plugin Lua into Kong's plugin path; loaded via
            # KONG_PLUGINS=bundled,body-capture. Read-only, like all ConfigMap mounts.
            - { name: plugins, mountPath: /usr/local/share/lua/5.1/kong/plugins/body-capture }
          resources: {{- toYaml .Values.kong.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: kong-config
        - name: plugins
          configMap:
            name: kong-body-capture-plugin
{{- end }}
