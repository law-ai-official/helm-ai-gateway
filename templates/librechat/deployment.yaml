{{- if .Values.librechat.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "librechat") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "librechat") | nindent 8 }}
    spec:
      containers:
        - name: librechat
          image: "{{ .Values.librechat.image.repository }}:{{ .Values.librechat.image.tag }}"
          imagePullPolicy: {{ .Values.librechat.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 3080 }
          env:
            - { name: MONGO_URI,    valueFrom: { secretKeyRef: { name: librechat-secret, key: MONGO_URI } } }
            - { name: JWT_SECRET,   valueFrom: { secretKeyRef: { name: librechat-secret, key: JWT_SECRET } } }
            - { name: CREDS_KEY,    valueFrom: { secretKeyRef: { name: librechat-secret, key: CREDS_KEY } } }
            - { name: PORT,         value: "3080" }
            - { name: ALLOW_REGISTRATION, value: "true" }
          readinessProbe:
            httpGet: { path: /, port: 3080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources: {{- toYaml .Values.librechat.resources | nindent 12 }}
{{- end }}
