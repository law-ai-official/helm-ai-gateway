{{- if .Values.librechat.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: librechat-secret
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_URI: {{ printf "mongodb://%s:%s@mongodb:27017/%s?authSource=admin" .Values.mongodb.auth.username .Values.mongodb.auth.password .Values.mongodb.auth.database | quote }}
  # JWT_SECRET, CREDS_KEY, REFRESH_TOKEN_SECRET - required by LibreChat. Change in production.
  JWT_SECRET: {{ .Values.librechat.jwtSecret | default "change-me-jwt-secret-32-chars-ok" | quote }}
  CREDS_KEY: {{ .Values.librechat.credsKey | default "change-me-creds-key-32-chars-ok" | quote }}
  REFRESH_TOKEN_SECRET: {{ .Values.librechat.refreshTokenSecret | default "change-me-refresh-token-secret-32-chars" | quote }}
{{- end }}
