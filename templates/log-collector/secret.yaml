{{- if .Values.logCollector.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: log-collector-secret
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql://%s:%s@postgres:5432/chat_log" .Values.postgres.auth.username .Values.postgres.auth.password | quote }}
  MINIO_ENDPOINT: {{ .Values.minio.endpoint | quote }}
  MINIO_PORT: {{ .Values.minio.port | quote }}
  MINIO_BUCKET: {{ .Values.minio.bucket | quote }}
  MINIO_ACCESS_KEY: {{ .Values.minio.accessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.minio.secretKey | quote }}
  LOG_VIEWER_TOKEN: {{ .Values.logCollector.viewerToken | quote }}
{{- end }}
