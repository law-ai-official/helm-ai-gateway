{{- if .Values.minio.deploy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "minio") | nindent 4 }}
  ports:
    - { name: api, port: 9000, targetPort: api }
    - { name: console, port: 9001, targetPort: console }
{{- end }}
