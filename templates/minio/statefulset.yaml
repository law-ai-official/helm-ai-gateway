{{- if .Values.minio.deploy.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "minio") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "minio") | nindent 8 }}
    spec:
      containers:
        - name: minio
          image: "{{ .Values.minio.deploy.image.repository }}:{{ .Values.minio.deploy.image.tag }}"
          imagePullPolicy: {{ .Values.minio.deploy.image.pullPolicy }}
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - { name: api, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          env:
            - { name: MINIO_ROOT_USER,     valueFrom: { secretKeyRef: { name: minio-secret, key: MINIO_ROOT_USER } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: minio-secret, key: MINIO_ROOT_PASSWORD } } }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /data }
          resources: {{- toYaml .Values.minio.deploy.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClass }}
        resources:
          requests:
            storage: {{ .Values.minio.deploy.persistence.size }}
{{- end }}
