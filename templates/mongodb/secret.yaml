{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.mongodb.auth.username | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.mongodb.auth.password | quote }}
  MONGO_INITDB_DATABASE: {{ .Values.mongodb.auth.database | quote }}
  # LibreChat connection string (no auth, single-node dev mode).
  MONGO_URL: {{ printf "mongodb://%s:%s@mongodb:27017/%s?authSource=admin" .Values.mongodb.auth.username .Values.mongodb.auth.password .Values.mongodb.auth.database | quote }}
{{- end }}
