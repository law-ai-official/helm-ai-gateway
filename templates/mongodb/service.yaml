{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "mongodb") | nindent 4 }}
  ports:
    - { name: tcp, port: 27017, targetPort: tcp }
{{- end }}
