{{- if .Values.mongodb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "mongodb") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "mongodb") | nindent 8 }}
    spec:
      containers:
        - name: mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
          ports:
            - { name: tcp, containerPort: 27017 }
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, valueFrom: { secretKeyRef: { name: mongodb-secret, key: MONGO_INITDB_ROOT_USERNAME } } }
            - { name: MONGO_INITDB_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: mongodb-secret, key: MONGO_INITDB_ROOT_PASSWORD } } }
            - { name: MONGO_INITDB_DATABASE,      valueFrom: { secretKeyRef: { name: mongodb-secret, key: MONGO_INITDB_DATABASE } } }
          readinessProbe:
            exec: { command: ["mongosh", "--eval", "db.adminCommand('ping')"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /data/db }
          resources: {{- toYaml .Values.mongodb.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClass }}
        resources:
          requests:
            storage: {{ .Values.mongodb.persistence.size }}
{{- end }}
