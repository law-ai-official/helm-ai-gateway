{{- if .Values.newapi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newapi
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "newapi") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "newapi") | nindent 8 }}
    spec:
      containers:
        - name: newapi
          image: "{{ .Values.newapi.image.repository }}:{{ .Values.newapi.image.tag }}"
          imagePullPolicy: {{ .Values.newapi.image.pullPolicy }}
          args: ["--log-dir", "/app/logs"]
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: SQL_DSN,           valueFrom: { secretKeyRef: { name: newapi-secret, key: SQL_DSN } } }
            - { name: REDIS_CONN_STRING, valueFrom: { secretKeyRef: { name: newapi-secret, key: REDIS_CONN_STRING } } }
            - { name: TZ,                value: "Asia/Shanghai" }
            - { name: ERROR_LOG_ENABLED, value: "true" }
            - { name: NODE_NAME,         value: "new-api-1" }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /data }
          resources: {{- toYaml .Values.newapi.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: newapi-data
{{- end }}
