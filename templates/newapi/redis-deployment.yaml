{{- if .Values.newapi.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newapi-redis
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "newapi-redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "newapi-redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: "{{ .Values.newapi.redis.image.repository }}:{{ .Values.newapi.redis.image.tag }}"
          imagePullPolicy: {{ .Values.newapi.redis.image.pullPolicy }}
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: newapi-redis-secret, key: REDIS_PASSWORD } } }
          ports:
            - { name: tcp, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.newapi.redis.resources | nindent 12 }}
{{- end }}
