{{- if .Values.newapi.redis.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: newapi-redis-secret
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.newapi.redis.auth.password | quote }}
{{- end }}
