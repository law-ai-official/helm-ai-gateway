{{- if .Values.newapi.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: newapi-redis
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "newapi-redis") | nindent 4 }}
  ports:
    - { name: tcp, port: 6379, targetPort: tcp }
{{- end }}
