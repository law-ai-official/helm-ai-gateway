{{- if .Values.newapi.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: newapi-secret
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  SQL_DSN: {{ printf "postgresql://%s:%s@postgres:5432/newapi" .Values.postgres.auth.username .Values.postgres.auth.password | quote }}
  REDIS_CONN_STRING: {{ printf "redis://:%s@newapi-redis:6379" .Values.newapi.redis.auth.password | quote }}
{{- end }}
