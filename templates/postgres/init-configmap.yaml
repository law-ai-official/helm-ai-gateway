{{- if .Values.postgres.enabled }}
{{- $user := .Values.postgres.auth.username -}}
{{- $dbs := .Values.postgres.auth.databases -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
data:
  # Mounted at /docker-entrypoint-initdb.d/init.sh - postgres runs this exactly once,
  # on an empty PGDATA. Restarting against an initialized volume skips it entirely.
  # `set -e` makes a mid-script failure loud (pod never Ready) rather than silent (partial DBs).
  init.sh: |
    #!/bin/sh
    set -e
    {{- range $dbs }}
    echo "Creating database {{ . }} owned by {{ $user }}"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
      SELECT 'CREATE DATABASE {{ . }} OWNER {{ $user }}'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ . }}')\gexec
      GRANT ALL PRIVILEGES ON DATABASE {{ . }} TO {{ $user }};
    EOSQL
    {{- end }}
{{- end }}
