{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  # Convenience: full DSN other workloads can mount if they prefer one var.
  POSTGRES_DSN: {{ printf "postgresql://%s:%s@postgres:5432/postgres" .Values.postgres.auth.username .Values.postgres.auth.password | quote }}
{{- end }}
