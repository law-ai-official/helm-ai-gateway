{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ include "ai-gateway.namespace" . }}
  labels: {{- include "ai-gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "ai-gateway.selectorLabels" (dict "root" . "name" "postgres") | nindent 4 }}
  ports:
    - { name: tcp, port: 5432, targetPort: tcp }
{{- end }}
