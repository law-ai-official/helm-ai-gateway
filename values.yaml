# helm-ai-gateway - one release, one namespace, the AI gateway tier.
# Dev-defaults ship inline (change-me-* placeholders); real secrets are injected
# via ArgoCD `valuesObject` (apps/helm-ai-gateway.yaml, local-only). No subcharts.
# ponytail: single-file values, no schema surprises.

global:
  # Target namespace for every workload. Chart does NOT create the namespace itself -
  # let `helm install --create-namespace` or ArgoCD `CreateNamespace=true` do it.
  namespace: ai-gateway

  # Global labels merged into every rendered resource.
  labels: {}

  # Storage class for PVCs.
  storageClass: local-path

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: app
    password: "change-me-postgres"
    # First-boot init script creates each named DB owned by `auth.username`. Idempotent
    # (postgres skips initdb when PGDATA is non-empty).
    databases:
      - newapi
      - chat_log
  persistence:
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "7"
    pullPolicy: IfNotPresent
  auth:
    username: app
    password: "change-me-mongo"
    database: librechat
  persistence:
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }

newapi:
  enabled: true
  image:
    repository: calciumion/new-api
    tag: "latest"
    pullPolicy: IfNotPresent
  # NewAPI needs redis for caching.
  redis:
    enabled: true
    image:
      repository: redis
      tag: "7-alpine"
      pullPolicy: IfNotPresent
    auth:
      password: "change-me-redis"
    resources:
      requests: { cpu: 50m, memory: 64Mi }
  service:
    nodePort:
      enabled: true
      port: 31800
  resources:
    requests: { cpu: 100m, memory: 256Mi }

librechat:
  enabled: true
  image:
    repository: ghcr.io/danny-avila/librechat
    tag: "latest"
    pullPolicy: IfNotPresent
  # NewAPI token LibreChat uses to reach the gateway. Real value injected
  # per-cluster (ArgoCD valuesObject on America, helm --set on China) - not in git.
  newApiKey: ""
  service:
    nodePort:
      enabled: true
      port: 30801
  resources:
    requests: { cpu: 100m, memory: 512Mi }

kong:
  enabled: true
  image:
    repository: kong
    tag: "3.8"
    pullPolicy: IfNotPresent
  # DB-less mode (declarative config via ConfigMap).
  service:
    nodePort:
      enabled: true
      httpPort: 30080
      httpsPort: 30443
  # 512Mi: the body-capture plugin base64-encodes large/binary bodies in memory
  # (multipart uploads) before forwarding, ~doubling the working set per request.
  resources:
    requests: { cpu: 100m, memory: 512Mi }

logCollector:
  enabled: true
  image:
    repository: node
    tag: "22-alpine"
    pullPolicy: IfNotPresent
  service:
    nodePort:
      enabled: true
      port: 30802
  # Shared secret gating the viewer UI + asset downloads (GET /, /log/*, /asset,
  # /api/logs*). Empty = open (dev). Real value is injected via ArgoCD
  # valuesObject (cluster-side) so it stays out of git. Pass as ?token= or
  # Authorization: Bearer.
  viewerToken: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }

# Object store for offloading large inline payloads (base64 images/files) from
# chat bodies. Can reuse an external MinIO (set deploy.enabled: false and point
# endpoint to the external service) or deploy a dedicated in-cluster MinIO
# (set deploy.enabled: true).
minio:
  # Deploy an in-cluster MinIO instance. When true, endpoint defaults to "minio"
  # (the in-cluster service name). When false, point endpoint to your external MinIO.
  deploy:
    enabled: false
    image:
      repository: minio/minio
      tag: "latest"
      pullPolicy: IfNotPresent
    persistence:
      size: 10Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
  # Connection settings used by log-collector. When deploy.enabled: true, override
  # endpoint to "minio" (the in-cluster service). Default points to external MinIO
  # in law-craw-web namespace for backward compatibility.
  endpoint: minio.law-craw-web.svc.cluster.local
  port: 9000
  bucket: chat-assets
  accessKey: minioadmin
  secretKey: "QXqpAKgT04Ak2MyKWC2L"
